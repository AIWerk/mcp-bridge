name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Validate recipe URLs
        run: bash scripts/validate-recipes.sh --ci
      - name: Verify recipe signatures
        run: node scripts/verify-signatures.mjs --ci
      - name: Check README recipe count matches live catalog
        run: |
          code=0
          node scripts/sync-recipe-count.mjs || code=$?
          if [ "$code" = "2" ]; then
            echo "::warning::catalog API unreachable, recipe-count check skipped"
            exit 0
          fi
          exit "$code"
